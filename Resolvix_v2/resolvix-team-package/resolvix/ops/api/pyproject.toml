[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resolvix-ops"
version = "1.0.0"
description = "Resolvix Ops API - Member C implementation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.1",
    "sqlalchemy>=2.0.36",
    "sse-starlette>=2.2.1",
    "bcrypt>=4.2.1",
    "itsdangerous>=2.2.0",
    "twilio>=9.3.7",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.6.1",
    "python-dateutil>=2.9.0",
    "tzdata>=2024.2",
    "resolvix-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "respx>=0.21.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["resolvix_ops*"]
