<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Campus Helpdesk — Department Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1F3B;
    --ink-soft:#2B3060;
    --paper:#F4EFE4;
    --marigold:#E8A33D;
    --marigold-deep:#C97F1E;
    --leaf:#4C9A6A;
    --clay:#D6604D;
    --cream:#F2EFE9;
    --card:#FFFFFF;
    --line:#E8E1D2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(232,163,61,0.08), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(76,154,106,0.06), transparent 40%),
      var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    padding:32px 20px 60px;
  }
  .wrap{ max-width:920px; margin:0 auto; }

  header{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px; }
  h1{
    font-family:'Space Grotesk', sans-serif; font-size:26px; font-weight:700; margin:0 0 4px;
  }
  .sub{ font-size:13px; color:var(--ink-soft); opacity:0.65; }

  .stats{ display:flex; gap:10px; }
  .stat{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:10px 16px; text-align:center; min-width:78px;
  }
  .stat .n{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; }
  .stat .l{ font-size:10px; text-transform:uppercase; letter-spacing:0.06em; opacity:0.55; margin-top:2px; }
  .stat.open .n{ color:var(--clay); }
  .stat.resolved .n{ color:var(--leaf); }

  .filters{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .chip{
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    padding:7px 14px; border-radius:20px; font-size:12.5px; cursor:pointer; font-family:inherit;
  }
  .chip.active{ background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .chip .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }

  .divider{ display:flex; align-items:center; gap:6px; margin:0 2px; opacity:0.3; }

  .insights{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; margin-bottom:20px;
  }
  .insights-title{
    font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:600;
    margin-bottom:12px; display:flex; align-items:center; gap:6px;
  }
  .insights-grid{ display:flex; gap:22px; flex-wrap:wrap; }
  .insight-block{ min-width:110px; }
  .insight-block .big{ font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; }
  .insight-block .lbl{ font-size:11px; opacity:0.55; margin-top:2px; }
  .insight-block.urgent .big{ color:var(--clay); }
  .cat-bars{ flex:1; min-width:200px; }
  .cat-bar-row{ display:flex; align-items:center; gap:8px; font-size:11.5px; margin-bottom:6px; }
  .cat-bar-row .cname{ width:42px; opacity:0.7; flex-shrink:0; }
  .cat-bar-track{ flex:1; height:6px; background:var(--paper); border-radius:4px; overflow:hidden; }
  .cat-bar-fill{ height:100%; background:var(--marigold); border-radius:4px; }
  .cat-bar-row .cn{ width:22px; text-align:right; opacity:0.6; flex-shrink:0; }

  .urgent-badge{
    display:inline-block; font-size:10px; font-weight:700; color:var(--clay);
    background:rgba(214,96,77,0.12); padding:2px 7px; border-radius:8px; margin-left:6px;
  }
  .row.urgent td:first-child{ border-left-color:var(--clay); }

  table{ width:100%; border-collapse:separate; border-spacing:0 8px; }
  .row{
    background:var(--card); border:1px solid var(--line);
  }
  .row td{ padding:12px 14px; font-size:13px; vertical-align:top; }
  .row td:first-child{ border-radius:12px 0 0 12px; border-left:3px solid var(--marigold); }
  .row.resolved td:first-child{ border-left-color:var(--leaf); }
  .row td:last-child{ border-radius:0 12px 12px 0; }

  .tid{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:12px; color:var(--ink-soft); }
  .cat-badge{
    display:inline-block; font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:10px;
    background:rgba(232,163,61,0.18); color:var(--marigold-deep); margin-top:4px;
  }
  .student{ font-weight:600; }
  .roll{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; opacity:0.6; }
  .query{ max-width:280px; }
  .when{ font-size:11px; opacity:0.5; white-space:nowrap; }

  .status-pill{
    font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; display:inline-block;
  }
  .status-pill.open{ background:rgba(214,96,77,0.14); color:var(--clay); }
  .status-pill.resolved{ background:rgba(76,154,106,0.14); color:var(--leaf); }

  .resolve-btn{
    border:1px solid var(--leaf); background:transparent; color:var(--leaf);
    padding:6px 12px; border-radius:8px; font-size:11.5px; font-weight:600; cursor:pointer;
    font-family:inherit;
  }
  .resolve-btn:hover{ background:var(--leaf); color:#fff; }
  .reopen-btn{
    border:1px solid var(--line); background:transparent; color:var(--ink-soft);
    padding:6px 12px; border-radius:8px; font-size:11.5px; cursor:pointer; font-family:inherit;
  }

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft); opacity:0.5; font-size:13.5px;
  }
  .refresh-note{
    text-align:center; font-size:11.5px; opacity:0.4; margin-top:18px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Department Dashboard</h1>
      <div class="sub">Tickets escalated from the Campus Helpdesk call agent</div>
    </div>
    <div class="stats">
      <div class="stat open"><div class="n" id="statOpen">–</div><div class="l">Open</div></div>
      <div class="stat resolved"><div class="n" id="statResolved">–</div><div class="l">Resolved</div></div>
    </div>
  </header>

  <div class="insights" id="insightsPanel">
    <div class="insights-title">📊 Aggregate insight — patterns across every call, not just escalations</div>
    <div class="insights-grid" id="insightsGrid">Loading…</div>
  </div>

  <div class="filters" id="filters">
    <button class="chip active" data-cat="">All categories</button>
    <button class="chip" data-cat="1">Fees</button>
    <button class="chip" data-cat="2">Hostel</button>
    <button class="chip" data-cat="3">Exams</button>
    <button class="chip" data-cat="4">Admissions</button>
    <button class="chip" data-cat="5">Placements</button>
    <button class="chip" data-cat="6">Other</button>
    <span class="divider">·</span>
    <button class="chip active" data-status="">All statuses</button>
    <button class="chip" data-status="open">Open only</button>
    <button class="chip" data-status="resolved">Resolved only</button>
  </div>

  <table id="ticketTable"><tbody id="ticketBody"></tbody></table>
  <div class="empty" id="emptyState" style="display:none;">No tickets match this filter.</div>
  <div class="refresh-note">Auto-refreshes every 8s · connects to the same backend as the student call prototype</div>
</div>

<script>
const API_BASE = 'http://localhost:8001';
let currentCat = '';
let currentStatus = '';

document.querySelectorAll('.chip[data-cat]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-cat]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    load();
  });
});
document.querySelectorAll('.chip[data-status]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-status]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentStatus = btn.dataset.status;
    load();
  });
});

function timeAgo(iso){
  const diffMs = Date.now() - new Date(iso + 'Z').getTime();
  const mins = Math.floor(diffMs / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs/24)}d ago`;
}

async function loadInsights(){
  try {
    const res = await fetch(`${API_BASE}/api/insights`);
    if(!res.ok) throw new Error(res.status);
    const d = await res.json();

    const maxCat = Math.max(1, ...Object.values(d.category_breakdown || {}));
    const bars = Object.entries(d.category_breakdown || {}).map(([name, count]) => `
      <div class="cat-bar-row">
        <div class="cname">${escapeHtml(name)}</div>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(count/maxCat*100).toFixed(0)}%"></div></div>
        <div class="cn">${count}</div>
      </div>
    `).join('') || '<div style="font-size:11.5px;opacity:0.5;">No queries logged yet</div>';

    document.getElementById('insightsGrid').innerHTML = `
      <div class="insight-block">
        <div class="big">${d.total_queries}</div>
        <div class="lbl">Total questions asked</div>
      </div>
      <div class="insight-block">
        <div class="big">${d.escalation_rate_pct}%</div>
        <div class="lbl">Escalation rate</div>
      </div>
      <div class="insight-block urgent">
        <div class="big">${d.urgent_open_tickets}</div>
        <div class="lbl">Urgent open tickets</div>
      </div>
      <div class="cat-bars">${bars}</div>
    `;
  } catch (err) {
    document.getElementById('insightsGrid').innerHTML = '<div style="font-size:11.5px;opacity:0.5;">Insights unavailable — backend unreachable</div>';
  }
}

async function load(){
  const params = new URLSearchParams();
  if(currentCat) params.set('category', currentCat);
  if(currentStatus) params.set('status', currentStatus);

  let tickets = [];
  try {
    const res = await fetch(`${API_BASE}/api/tickets?${params.toString()}`);
    if(!res.ok) throw new Error(res.status);
    tickets = await res.json();
  } catch (err) {
    document.getElementById('ticketBody').innerHTML = '';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('emptyState').textContent = `Can't reach backend at ${API_BASE} — is uvicorn running?`;
    return;
  }

  const openCount = tickets.filter(t => t.status === 'open').length;
  const resolvedCount = tickets.filter(t => t.status === 'resolved').length;
  // stats should reflect totals regardless of filter, so fetch unfiltered too if a filter is active
  if(currentCat || currentStatus){
    fetch(`${API_BASE}/api/tickets`).then(r => r.json()).then(all => {
      document.getElementById('statOpen').textContent = all.filter(t => t.status === 'open').length;
      document.getElementById('statResolved').textContent = all.filter(t => t.status === 'resolved').length;
    }).catch(() => {});
  } else {
    document.getElementById('statOpen').textContent = openCount;
    document.getElementById('statResolved').textContent = resolvedCount;
  }

  const body = document.getElementById('ticketBody');
  const empty = document.getElementById('emptyState');

  if(tickets.length === 0){
    body.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = 'No tickets match this filter.';
    return;
  }
  empty.style.display = 'none';

  body.innerHTML = tickets.map(t => `
    <tr class="row ${t.status} ${t.urgency === 'high' ? 'urgent' : ''}">
      <td>
        <div class="tid">#${t.id}${t.urgency === 'high' ? '<span class="urgent-badge">🚨 URGENT</span>' : ''}</div>
        <div class="cat-badge">${t.category_label}</div>
      </td>
      <td>
        <div class="student">${escapeHtml(t.name)}</div>
        <div class="roll">${escapeHtml(t.roll_no)}</div>
      </td>
      <td class="query">${escapeHtml(t.query)}</td>
      <td class="when">${timeAgo(t.created_at)}</td>
      <td><span class="status-pill ${t.status}">${t.status}</span></td>
      <td>
        ${t.status === 'open'
          ? `<button class="resolve-btn" onclick="setStatus('${t.id}','resolved')">Mark resolved</button>`
          : `<button class="reopen-btn" onclick="setStatus('${t.id}','open')">Reopen</button>`}
      </td>
    </tr>
  `).join('');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function setStatus(id, status){
  try {
    await fetch(`${API_BASE}/api/tickets/${id}/status`, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ status })
    });
  } catch (err) { console.error(err); }
  load();
}

load();
loadInsights();
setInterval(load, 8000);
setInterval(loadInsights, 8000);
</script>
</body>
</html>
